<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">
      <img src="/reddop-logo.avif" alt="Reddop" height="30" class="d-inline-block align-top">
    </a>
  </div>
</nav>

<div class="container mt-4 mb-5">
  <h1 class="mb-4">Lista de Tarefas</h1>

  <div class="card mb-4">
    <div class="card-header bg-primary text-white">
      <h5 class="card-title mb-0">Adicionar Tarefa</h5>
    </div>
    <div class="card-body">
      <form [formGroup]="taskForm" (ngSubmit)="addTask()" class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Título</label>
          <input type="text" formControlName="title" class="form-control" placeholder="Título" />
          <div *ngIf="taskForm.get('title')?.invalid && taskForm.get('title')?.touched" class="text-danger small mt-1">
            Título é obrigatório.
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label">Data de Vencimento</label>
          <input type="date" formControlName="dueDate" class="form-control" />
          <div *ngIf="taskForm.get('dueDate')?.invalid && taskForm.get('dueDate')?.touched" class="text-danger small mt-1">
            Data de vencimento é obrigatória.
          </div>
        </div>

        <div class="col-md-8">
          <label class="form-label">Descrição</label>
          <input type="text" formControlName="description" class="form-control" placeholder="Descrição" />
        </div>

        <div class="col-md-4">
          <label class="form-label">Status Inicial</label>
          <select formControlName="status" class="form-select">
            <option value="Pendente">Pendente</option>
            <option value="Em Andamento">Em Andamento</option>
            <option value="Concluída">Concluída</option>
          </select>
        </div>

        <div class="col-12 text-end mt-3">
          <button type="submit" class="btn btn-primary" [disabled]="taskForm.invalid">Adicionar Tarefa</button>
        </div>
      </form>
    </div>
  </div>

  <div class="row g-4">
    <div *ngFor="let task of tasks" class="col-md-6 col-lg-4">
      <div class="card h-100" [ngClass]="{'border-success': task.status === 'Concluída', 'text-muted': task.status === 'Concluída'}">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="card-title mb-0" [ngStyle]="{'text-decoration': task.status === 'Concluída' ? 'line-through' : 'none'}">{{ task.title }}</h5>
            <span class="badge" 
                  [ngClass]="{
                    'bg-warning text-dark': task.status === 'Pendente',
                    'bg-info text-dark': task.status === 'Em Andamento',
                    'bg-success': task.status === 'Concluída'
                  }">
              {{ task.status }}
            </span>
          </div>
          <p class="card-text">{{ task.description }}</p>
          <p class="card-text"><small class="text-muted"><i class="bi bi-calendar-event me-1"></i>Vencimento: {{ task.dueDate | date:'dd/MM/yyyy' }}</small></p>
        </div>
        <div class="card-footer bg-transparent border-top-0">
          <div class="d-flex justify-content-between gap-2">
            <button class="btn btn-sm btn-outline-warning w-100" (click)="changeStatus(task, 'Pendente')" [disabled]="task.status === 'Pendente'" title="Pendente">
              <i class="bi bi-clock"></i>
            </button>
            <button class="btn btn-sm btn-outline-info w-100" (click)="changeStatus(task, 'Em Andamento')" [disabled]="task.status === 'Em Andamento'" title="Em Andamento">
              <i class="bi bi-play-circle"></i>
            </button>
            <button class="btn btn-sm btn-outline-success w-100" (click)="changeStatus(task, 'Concluída')" [disabled]="task.status === 'Concluída'" title="Concluir">
              <i class="bi bi-check-circle"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
