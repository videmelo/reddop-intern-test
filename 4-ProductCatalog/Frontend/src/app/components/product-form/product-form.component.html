<div class="card shadow-sm border-0 h-100 d-flex flex-column">
  <div class="card-header bg-white">
    <h4 class="mb-0">Novo Produto</h4>
  </div>
  <div class="card-body d-flex flex-column">

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="d-flex flex-column flex-grow-1">
      
      <div class="mb-3">
        <label for="name" class="form-label">Nome do Produto</label>
        <input type="text" 
               id="name" 
               class="form-control" 
               formControlName="name" 
               [ngClass]="{'is-invalid': productForm.get('name')?.invalid && productForm.get('name')?.touched}">
        <div class="invalid-feedback">O nome é obrigatório e deve ter no mínimo 3 caracteres.</div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="price" class="form-label">Preço</label>
          <div class="input-group">
            <span class="input-group-text">R$</span>
            <input type="number" 
                   id="price" 
                   step="0.01"
                   class="form-control" 
                   formControlName="price"
                   [ngClass]="{'is-invalid': productForm.get('price')?.invalid && productForm.get('price')?.touched}">
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label for="category" class="form-label">Categoria</label>
          <select id="category" 
                  class="form-select" 
                  formControlName="categoryId"
                  [ngClass]="{'is-invalid': productForm.get('categoryId')?.invalid && productForm.get('categoryId')?.touched}">
            <option value="">Selecione...</option>
            <option *ngIf="isLoadingCategories" disabled>Carregando...</option>
            <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
          </select>
          <div class="invalid-feedback">Selecione uma categoria.</div>
        </div>
      </div>

      <div class="d-flex justify-content-end mt-auto pt-4">
        <button type="submit" class="btn btn-primary" [disabled]="productForm.invalid || isSubmitting">
          <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          Salvar Produto
        </button>
      </div>

    </form>

  </div>
</div>
